name: Build reading website

on:
  push:
    branches:
      - main # Trigger on pushes to the default branch
    paths-ignore:
      - README.md
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the reviewed website to GitHub Pages'
        type: boolean
        required: false
        default: false
      reviewed_snapshot:
        description: 'Use verified preview r3 (requires deploy and unchanged publication sources)'
        type: boolean
        required: false
        default: false

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

permissions:
  contents: read

jobs:
  build_project:
    # Private pushes do not consume hosted build minutes. Manual builds remain opt-in.
    if: inputs.reviewed_snapshot != true && (github.event_name == 'workflow_dispatch' || github.event.repository.private == false)
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Check sources, reading links, and dependency maps
        run: python3 scripts/check.py --tracked

      - name: Build project
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          build: true
          # No Lake lint driver is defined; Lean's own linters still run on build.
          lint: false
          # Keep the paper-order entry point; check its import closure above.
          mk_all-check: false

      - name: Compile Blueprint
        uses: xu-cheng/texlive-action@f886de8159e5952a131848a5fa9c3196a2132b5d
        with:
          docker_image: ghcr.io/xu-cheng/texlive-full:20250401
          run: |
            apk add --update make py3-pip git pkgconfig graphviz graphviz-dev gcc musl-dev
            # Alpine keeps Graphviz plugins outside the default linker search path.
            export LIBRARY_PATH="/usr/lib/graphviz${LIBRARY_PATH:+:$LIBRARY_PATH}"
            export LD_LIBRARY_PATH="/usr/lib/graphviz${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            python3 -m venv /tmp/blueprint-env
            . /tmp/blueprint-env/bin/activate
            pip install -r blueprint/requirements.txt
            leanblueprint pdf
            leanblueprint web
            python scripts/site.py licenses

      - name: Compile Lean API documentation
        run: python3 scripts/site.py api

      - name: Check Blueprint declaration links
        run: lake exe checkdecls blueprint/lean_decls

      - name: Assemble and check website
        run: python3 scripts/site.py assemble --compact --source-links github --output "${RUNNER_TEMP}/nth-tropical-site"

      - name: Upload downloadable preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reading-website
          path: ${{ runner.temp }}/nth-tropical-site
          retention-days: 7
          if-no-files-found: error

      - name: Upload website
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/nth-tropical-site

  reviewed_snapshot:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && inputs.reviewed_snapshot && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Verify reviewed website snapshot
    steps:
      - name: Checkout current sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Require unchanged publication sources
        run: |
          git diff --exit-code 8294d8b94ddf782294d96f670c657bbeb0ca928b HEAD -- \
            NthTropicalNevanlinna NthTropicalNevanlinna.lean blueprint home_page \
            LICENSE lean-toolchain lakefile.toml lake-manifest.json docbuild

      - name: Download and verify the reviewed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "${RUNNER_TEMP}/reviewed-snapshot"
          gh release download private-review-20260928-r3 \
            --pattern nth-tropical-nevanlinna-website-preview-r3.zip \
            --dir "${RUNNER_TEMP}/reviewed-snapshot"
          cd "${RUNNER_TEMP}/reviewed-snapshot"
          echo '7ea8f92c6c85cbd9c49378c5a5d8e74c89b85a28da9728c9ca6b204be1ba9259  nth-tropical-nevanlinna-website-preview-r3.zip' | sha256sum --check
          unzip -q nth-tropical-nevanlinna-website-preview-r3.zip
          # The local launchers are unnecessary in the published static website.
          rm nth-tropical-nevanlinna-preview/preview.py \
            'nth-tropical-nevanlinna-preview/Open Preview.command' \
            nth-tropical-nevanlinna-preview/README-preview.txt

      - name: Check sources, website links, and licenses
        run: python3 scripts/check.py --tracked --hosted --site "${RUNNER_TEMP}/reviewed-snapshot/nth-tropical-nevanlinna-preview"

      - name: Upload verified website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/reviewed-snapshot/nth-tropical-nevanlinna-preview

  deploy:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main' && (needs.build_project.result == 'success' || needs.reviewed_snapshot.result == 'success')
    needs: [build_project, reviewed_snapshot]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy reviewed website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
